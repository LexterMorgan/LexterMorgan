<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">Michael Alexander | Data, analytics and AI</title>
  <desc id="desc">Animated terminal portrait of a data science graduate in Jakarta. Workflow: ingest, clean, model, explain. Learning AI-assisted development, prompting and output verification. Animation illustrates a workflow; it does not show live metrics.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#243440" stroke-width=".5" opacity=".38"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="958" height="488" rx="18"/></clipPath>
    <style>
      text {font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;fill:#e2edf3}
      .muted{fill:#8fa8b8} .accent{fill:#65ded3} .tiny{font-size:11px;letter-spacing:1.4px}
      .label{font-size:12px;letter-spacing:1.5px}
      .cursor{animation:blink 1.4s steps(2,end) infinite}
      .scan{animation:scan 12s linear infinite;opacity:.05}
      .packet{animation:travel 9s linear infinite}
      .reveal{animation:reveal 12s ease-in-out infinite}
      .r2{animation-delay:1s}.r3{animation-delay:2s}
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{from{transform:translateY(-490px)}to{transform:translateY(490px)}}
      @keyframes travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(654px);opacity:0}}
      @keyframes reveal{0%,100%{opacity:.45}15%,75%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.cursor,.scan,.packet,.reveal{animation:none}.scan,.packet{display:none}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="960" height="490" fill="#0b1118"/>
    <rect width="960" height="490" fill="url(#grid)"/>
    <path d="M0 51H960M0 441H960" stroke="#243440"/>
    <circle cx="29" cy="26" r="4" fill="#65ded3"/>
    <text x="44" y="30" class="tiny">LEXTERMORGAN / PERSONAL WORKSPACE</text>
    <text x="931" y="30" text-anchor="end" class="tiny muted">01 : PROFILE</text>
    <rect x="28" y="77" width="166" height="158" rx="10" fill="#101b25" stroke="#243440"/>
    <g class="accent" font-size="12" xml:space="preserve">
      <text x="46" y="106" class="muted" font-size="10">+-- IDENTITY --+</text>
      <text x="47" y="134"> /\  /\   /\ </text>
      <text x="47" y="153">/  \/  \ /  \</text>
      <text x="47" y="172">|      |/ /\ \</text>
      <text x="47" y="191">|_|\/|_/_/  \_\</text>
      <text x="46" y="218" class="muted" font-size="10">MA // JAKARTA</text>
    </g>
    <text x="222" y="100" class="label accent">HELLO, I'M</text>
    <text x="219" y="145" font-size="37" font-weight="700" letter-spacing="-1.5">Michael Alexander</text>
    <text x="222" y="177" font-size="15" class="muted">DATA SCIENCE / ANALYTICS / BUSINESS INTELLIGENCE</text>
    <text x="222" y="211" font-size="14">I work with data. I build. I keep learning.</text>
    <rect x="658" y="199" width="8" height="15" fill="#65ded3" class="cursor"/>
    <text x="29" y="266" class="tiny muted">WORKFLOW / FROM SOURCE TO EXPLANATION</text>
    <path d="M140 302H814" stroke="#243440" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="145" cy="302" r="4" fill="#65ded3" class="packet"/>
    <g><rect x="28" y="283" width="195" height="39" rx="6" fill="#101b25" stroke="#243440"/><text x="44" y="307" class="label muted">01</text><text x="82" y="307" class="label">INGEST</text></g>
    <g><rect x="264" y="283" width="195" height="39" rx="6" fill="#101b25" stroke="#243440"/><text x="280" y="307" class="label muted">02</text><text x="318" y="307" class="label">CLEAN</text></g>
    <g><rect x="500" y="283" width="195" height="39" rx="6" fill="#101b25" stroke="#243440"/><text x="516" y="307" class="label muted">03</text><text x="554" y="307" class="label">MODEL</text></g>
    <g><rect x="736" y="283" width="195" height="39" rx="6" fill="#101b25" stroke="#243440"/><text x="752" y="307" class="label muted">04</text><text x="790" y="307" class="label">EXPLAIN</text></g>
    <rect x="28" y="348" width="904" height="70" rx="8" fill="#101b25" stroke="#243440"/>
    <text x="45" y="372" class="tiny accent">LEARNING LOG</text>
    <text x="45" y="398" font-size="13" class="reveal">[+] AI-assisted development</text>
    <text x="359" y="398" font-size="13" class="reveal r2">[+] Prompting</text>
    <text x="620" y="398" font-size="13" class="reveal r3">[+] Checking AI outputs</text>
    <text x="29" y="470" class="tiny muted">SQL + PYTHON + BI</text>
    <text x="931" y="470" class="tiny muted" text-anchor="end">BUILD / QUESTION / REFINE</text>
    <rect y="0" width="960" height="38" fill="#65ded3" class="scan"/>
  </g>
  <rect x=".5" y=".5" width="959" height="489" rx="18" fill="none" stroke="#243440"/>
</svg>
