<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Michael.OS — Michael Alexander</title>
<desc id="desc">Animated terminal dashboard for Michael Alexander, a data analyst based in Jakarta.</desc>
<defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#1d2730;dominant-baseline:alphabetic}.muted{fill:#5d6d78}.cyan{fill:#087d82}.line{stroke:#1d2730}.panel{fill:#ffffff;stroke:#ccd5db}.soft{fill:#2e2e2e}.barbg{fill:#dfe7eb}.bar{fill:#1d2730}.header{font-size:23px;letter-spacing:.5px}.body{font-size:19px}.small{font-size:16px}.log{font-size:18px}.pulse{animation:pulse 2.4s ease-in-out infinite}.p2{animation-delay:.4s}.p3{animation-delay:.8s}.p4{animation-delay:1.2s}.p5{animation-delay:1.6s}.reveal{animation:reveal 10s ease-in-out infinite}.d1{animation-delay:1.2s}.d2{animation-delay:2.4s}.d3{animation-delay:3.6s}.cursor{animation:blink 1.1s steps(2,end) infinite}.scan{animation:scan 10s linear infinite;opacity:.07}.b1{animation:load1 8s ease-in-out infinite}.b2{animation:load2 8s ease-in-out infinite}.b3{animation:load3 8s ease-in-out infinite}.b4{animation:load4 8s ease-in-out infinite}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes reveal{0%,15%,100%{opacity:.25}25%,80%{opacity:1}}@keyframes scan{from{transform:translateY(-700px)}to{transform:translateY(700px)}}@keyframes load1{0%,100%{width:0}35%,70%{width:252px}}@keyframes load2{0%,100%{width:0}35%,70%{width:220px}}@keyframes load3{0%,100%{width:0}35%,70%{width:188px}}@keyframes load4{0%,100%{width:0}35%,70%{width:116px}}@media(prefers-reduced-motion:reduce){.pulse,.reveal,.cursor,.scan,.bar{animation:none}.b1{width:252px}.b2{width:220px}.b3{width:188px}.b4{width:116px}}
</style>
<clipPath id="clip"><rect x="1" y="1" width="1098" height="698" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1100" height="700" fill="#f5f7f8"/>
<rect width="1100" height="700" fill="#f5f7f8"/>
<rect x="24" y="24" width="1052" height="286" rx="16" class="panel"/>
<text x="46" y="61" class="header cyan">┌─ MICHAEL.OS ─────────────────────────────────────────────────────────────┐</text>
<text x="46" y="95" class="body">│ user        michael alexander       location  jakarta, indonesia        │</text>
<text x="46" y="127" class="body">│ role        data analyst            status    building                  │</text>
<text x="46" y="159" class="header">└─────────────────────────────────────────────────────────────────────────┘</text>
<text x="46" y="205" class="header cyan">│ DATA PIPELINE                                                        │</text>
<text x="46" y="244" class="body">│ [INGEST] ━━━ [CLEAN] ━━━ [MODEL] ━━━ [EXPLAIN] ━━━ [DECIDE]          │</text>
<circle cx="155" cy="275" r="7" fill="#1d2730" class="pulse"/><circle cx="346" cy="275" r="7" fill="#1d2730" class="pulse p2"/><circle cx="535" cy="275" r="7" fill="#1d2730" class="pulse p3"/><circle cx="724" cy="275" r="7" fill="#087d82" class="pulse p4"/><circle cx="902" cy="275" r="7" fill="none" stroke="#1d2730" stroke-width="2" class="pulse p5"/>
<rect x="24" y="330" width="1052" height="346" rx="16" class="panel"/>
<text x="46" y="367" class="header cyan">┌─ WORKBENCH ──────────────────────────────────────────────────────────────┐</text>
<text x="46" y="409" class="body">│ sql_query       </text><rect x="280" y="391" width="280" height="19" rx="3" class="barbg"/><rect x="280" y="391" width="0" height="19" rx="3" class="bar b1"/><text x="580" y="409" class="body muted">READY       │</text>
<text x="46" y="443" class="body">│ data_quality    </text><rect x="280" y="425" width="280" height="19" rx="3" class="barbg"/><rect x="280" y="425" width="0" height="19" rx="3" class="bar b2"/><text x="580" y="443" class="body muted">CHECKING    │</text>
<text x="46" y="477" class="body">│ ai_workbench    </text><rect x="280" y="459" width="280" height="19" rx="3" class="barbg"/><rect x="280" y="459" width="0" height="19" rx="3" class="bar b3"/><text x="580" y="477" class="body muted">LEARNING     │</text>
<text x="46" y="511" class="body">│ coffee_level    </text><rect x="280" y="493" width="280" height="19" rx="3" class="barbg"/><rect x="280" y="493" width="0" height="19" rx="3" class="bar b4"/><text x="580" y="511" class="body muted">LOW          │</text>
<text x="46" y="545" class="header">└─────────────────────────────────────────────────────────────────────────┘</text>
<text x="46" y="581" class="log reveal">│ &gt; analyzing messy data</text>
<text x="46" y="609" class="log reveal d1">│ &gt; validating business metrics</text>
<text x="46" y="637" class="log reveal d2">│ &gt; building decision-ready dashboards</text>
<text x="46" y="665" class="log reveal d3">│ &gt; exploring AI-assisted workflows<tspan class="cursor cyan">_</tspan></text>
<rect y="0" width="1100" height="3" fill="#087d82" class="scan"/>
</g>
<rect x="1" y="1" width="1098" height="698" rx="22" fill="none" stroke="#ccd5db"/>
</svg>
