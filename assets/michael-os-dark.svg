<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
<title id="title">Michael.OS — Michael Alexander</title>
<desc id="desc">Animated terminal dashboard for Michael Alexander, a data analyst based in Jakarta.</desc>
<defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#f4f7f8}.panel{fill:#1f1f1f;stroke:#474747;stroke-width:1.5}.muted{fill:#9aa5ab}.cyan{fill:#70e6dc}.header{font-size:24px;letter-spacing:.4px}.hero{font-size:36px;font-weight:700;letter-spacing:1px}.body{font-size:20px}.small{font-size:17px}.micro{font-size:15px}.barbg{fill:#363636}.bar{fill:#f4f7f8}.cursor{animation:blink 1.1s steps(2,end) infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.p2{animation-delay:.35s}.p3{animation-delay:.7s}.p4{animation-delay:1.05s}.p5{animation-delay:1.4s}.flow{stroke:#70e6dc;stroke-width:3;stroke-dasharray:8 12;animation:flow 2s linear infinite}.fade{animation:fade 12s ease-in-out infinite}.d1{animation-delay:1.2s}.d2{animation-delay:2.4s}.d3{animation-delay:3.6s}.b1{animation:load1 9s ease-in-out infinite}.b2{animation:load2 9s ease-in-out infinite}.b3{animation:load3 9s ease-in-out infinite}.b4{animation:load4 9s ease-in-out infinite}.scan{animation:scan 12s linear infinite;opacity:.065}.boot{animation:boot 6s steps(2,end) infinite}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-40}}@keyframes fade{0%,12%,100%{opacity:.22}24%,80%{opacity:1}}@keyframes load1{0%,100%{width:0}34%,74%{width:250px}}@keyframes load2{0%,100%{width:0}34%,74%{width:222px}}@keyframes load3{0%,100%{width:0}34%,74%{width:205px}}@keyframes load4{0%,100%{width:0}34%,74%{width:170px}}@keyframes scan{from{transform:translateY(-900px)}to{transform:translateY(900px)}}@keyframes boot{0%,15%{opacity:.3}16%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){.cursor,.pulse,.flow,.fade,.bar,.scan,.boot{animation:none}.b1{width:250px}.b2{width:222px}.b3{width:205px}.b4{width:170px}}
</style>
<clipPath id="clip"><rect x="1" y="1" width="1098" height="898" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1100" height="900" fill="#121212"/>
<rect x="24" y="24" width="1052" height="276" rx="17" class="panel"/>
<circle cx="1007" cy="56" r="5" fill="#70e6dc" class="pulse"/><circle cx="1028" cy="56" r="5" fill="#9aa5ab" class="pulse p2"/><circle cx="1049" cy="56" r="5" fill="#9aa5ab" class="pulse p3"/>
<text x="47" y="64" class="header cyan">┌─ MICHAEL.OS / PROFILE ─────────────────────────────────────────────────┐</text>
<text x="47" y="101" class="body">│ user      michael alexander       location  jakarta, indonesia         │</text>
<text x="47" y="135" class="body">│ role      data analyst            status    open to work               │</text>
<text x="47" y="180" class="hero boot">MICHAEL ALEXANDER</text>
<text x="47" y="219" class="body muted">DATA SCIENCE / ANALYTICS / BUSINESS INTELLIGENCE</text>
<text x="47" y="261" class="body">&gt; building decision-ready data products<tspan class="cursor cyan">_</tspan></text>
<rect x="24" y="322" width="1052" height="240" rx="17" class="panel"/>
<text x="47" y="362" class="header cyan">┌─ DATA PIPELINE / FROM SOURCE TO DECISION ───────────────────────────────┐</text>
<line x1="145" y1="434" x2="955" y2="434" class="flow"/>
<g><rect x="45" y="402" width="180" height="62" rx="7" fill="#262626" stroke="#474747"/><text x="135" y="440" text-anchor="middle" class="body">INGEST</text><circle cx="135" cy="486" r="7" fill="#f4f7f8" class="pulse"/></g>
<g><rect x="252" y="402" width="180" height="62" rx="7" fill="#262626" stroke="#474747"/><text x="342" y="440" text-anchor="middle" class="body">CLEAN</text><circle cx="342" cy="486" r="7" fill="#f4f7f8" class="pulse p2"/></g>
<g><rect x="459" y="402" width="180" height="62" rx="7" fill="#262626" stroke="#474747"/><text x="549" y="440" text-anchor="middle" class="body">MODEL</text><circle cx="549" cy="486" r="7" fill="#f4f7f8" class="pulse p3"/></g>
<g><rect x="666" y="402" width="180" height="62" rx="7" fill="#262626" stroke="#474747"/><text x="756" y="440" text-anchor="middle" class="body">EXPLAIN</text><circle cx="756" cy="486" r="7" fill="#70e6dc" class="pulse p4"/></g>
<g><rect x="873" y="402" width="180" height="62" rx="7" fill="#262626" stroke="#474747"/><text x="963" y="440" text-anchor="middle" class="body">DECIDE</text><circle cx="963" cy="486" r="7" fill="none" stroke="#f4f7f8" stroke-width="2" class="pulse p5"/></g>
<text x="47" y="536" class="small muted">signal: source → quality → metric → explanation → action</text>
<rect x="24" y="584" width="1052" height="292" rx="17" class="panel"/>
<text x="47" y="624" class="header cyan">┌─ DATA + AI WORKBENCH ──────────────────────────────────────────────────┐</text>
<line x1="624" y1="649" x2="624" y2="790" stroke="#474747"/>
<text x="47" y="662" class="small muted">LIVE SIGNALS</text>
<text x="47" y="698" class="small">sql_query</text><rect x="220" y="681" width="270" height="18" rx="3" class="barbg"/><rect x="220" y="681" width="0" height="18" rx="3" class="bar b1"/><text x="507" y="698" class="small muted">READY</text>
<text x="47" y="732" class="small">data_quality</text><rect x="220" y="715" width="270" height="18" rx="3" class="barbg"/><rect x="220" y="715" width="0" height="18" rx="3" class="bar b2"/><text x="507" y="732" class="small muted">CHECKING</text>
<text x="47" y="766" class="small">dashboard</text><rect x="220" y="749" width="270" height="18" rx="3" class="barbg"/><rect x="220" y="749" width="0" height="18" rx="3" class="bar b3"/><text x="507" y="766" class="small muted">BUILDING</text>
<text x="47" y="800" class="small">ai_workbench</text><rect x="220" y="783" width="270" height="18" rx="3" class="barbg"/><rect x="220" y="783" width="0" height="18" rx="3" class="bar b4"/><text x="507" y="800" class="small muted">LEARNING</text>
<text x="655" y="662" class="small muted">AI PROTOCOL</text>
<text x="655" y="698" class="small fade">01  PLAN     define question + constraints</text>
<text x="655" y="732" class="small fade d1">02  BUILD    prototype the useful part</text>
<text x="655" y="766" class="small fade d2">03  TEST     run code + check numbers</text>
<text x="655" y="800" class="small fade d3">04  VERIFY   inspect sources + assumptions</text>
<line x1="47" y1="823" x2="1052" y2="823" stroke="#474747"/>
<text x="47" y="854" class="micro fade">&gt; analyzing messy data  /  validating metrics  /  building dashboards  /  checking AI output<tspan class="cursor cyan">_</tspan></text>
<rect y="0" width="1100" height="4" fill="#70e6dc" class="scan"/>
</g>
<rect x="1" y="1" width="1098" height="898" rx="24" fill="none" stroke="#474747"/>
</svg>
